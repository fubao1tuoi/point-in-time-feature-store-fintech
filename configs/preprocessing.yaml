version: 1
name: fraud_baseline_preprocessor_v1
fit_split: train
fit_time_column: TransactionDT
numeric_imputation: median
categorical_encoding: fixed_vocabulary
categorical_min_frequency: 20
missing_category_token: __MISSING__
unknown_category_token: __UNKNOWN__
numeric_features:
  - TransactionAmt
categorical_features:
  - ProductCD
  - card1
  - card2
  - card3
  - card4
  - card5
  - card6
  - addr1
  - addr2
  - P_emaildomain
  - R_emaildomain
  - DeviceType
  - DeviceInfo
  - entity_resolution_level
