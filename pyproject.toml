[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pit-feature-store-fintech"
version = "0.1.0"
description = "Point-in-time correct feature store for fraud detection using IEEE-CIS data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyarrow>=16,<20",
    "pyyaml>=6,<7",
]

[project.scripts]
profile-ieee-cis = "pit_feature_store.profiling:main"
analyze-entity-keys = "pit_feature_store.entity_analysis:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

